<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org"></script>
</head>
<body style="background-color: #0b0b0b;">
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const artist = urlParams.get('artist') || '';
        const album = urlParams.get('album') || '';
        
        if (artist || album) {
            // Собираем поисковой запрос
            const rawQuery = artist + " " + album + " Full Album";
            const searchQuery = encodeURIComponent(rawQuery);
            
            // Базовый URL стриминга YouTube Music
            const baseUrl = "https://music.youtube.com";
            
            // Чистая склейка через классический плюс
            const musicUrl = baseUrl + searchQuery;
            
            // Нативный переход внутри Telegram
            tg.openLink(musicUrl);
            
            // Закрываем окно WebApp
            tg.close();
        } else {
            tg.close();
        }
    </script>
</body>
</html>
