<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .metal-btn {
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 20px 40px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }
        .metal-btn:active {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <a id="lnk" class="metal-btn" href="#">🔊 LISTEN IN TG</a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const artist = urlParams.get('artist') || '';
        const album = urlParams.get('album') || '';

        if (artist || album) {
            const rawQuery = artist + " " + album + " Full Album";
            const searchQuery = encodeURIComponent(rawQuery);
            
            // --- СТРОГАЯ БЕЗОПАСНАЯ СКЛЕЙКА ДЛЯ ОБХОДА БАГА ---
            const p = "https://";
            const m = "music.";
            const y = "youtube.com";
            const s = "/search?q=";
            
            // Полная склейка домена по кусочкам через плюс
            const musicUrl = p + m + y + s + searchQuery;
            // --------------------------------------------------

            document.getElementById('lnk').href = musicUrl;
        }
    </script>
</body>
</html>
