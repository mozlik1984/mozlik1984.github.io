    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const artist = urlParams.get('artist') || '';
        const album = urlParams.get('album') || '';

        document.getElementById('play-btn').onclick = function() {
            if (artist || album) {
                const rawQuery = artist + " " + album + " Full Album";
                const searchQuery = encodeURIComponent(rawQuery);
                const baseUrl = "https://youtube.com";
                const musicUrl = baseUrl + searchQuery;

                // Передаем параметр try_instant_view: false, чтобы обойти блокировку Telegram
                tg.openLink(musicUrl, { try_instant_view: false });
                
                // На всякий случай дублируем классическим браузерным переходом, если API ТГ зависнет
                setTimeout(function() {
                    window.open(musicUrl, '_blank');
                    tg.close();
                }, 100);
            } else {
                tg.close();
            }
        };
    </script>
