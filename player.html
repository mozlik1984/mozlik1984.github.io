<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Metal Hub Player</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #eeeeee;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Надежный мобильный эмбед, который выводит чистые результаты без лишних блоков сайта -->
        <iframe id="yt-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем шторку на весь экран

        const urlParams = new URLSearchParams(window.location.search);
        const artist = urlParams.get('artist') || '';
        const album = urlParams.get('album') || '';
        
        if (artist || album) {
            const fullName = `${artist} ${album}`.trim();
            const searchQuery = encodeURIComponent(`${fullName} Full Album`);
            
            // Используем специальную мобильную поисковую выдачу YouTube, которая отлично работает внутри Iframe
            const playerSrc = `https://youtube.com{searchQuery}`;
            
            document.getElementById('yt-player').src = playerSrc;
        } else {
            alert("Release data missing");
        }
    </script>
</body>
</html>
