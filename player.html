<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #play-btn {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 20px 40px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }
        #play-btn:active {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Брутальная блэк-метал кнопка для обхода блокировок Telegram -->
    <button id="play-btn">🔊 LISTEN IN TG</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const artist = urlParams.get('artist') || '';
        const album = urlParams.get('album') || '';

        // Назначаем действие строго по клику пользователя
        document.getElementById('play-btn').onclick = function() {
            if (artist || album) {
                const rawQuery = artist + " " + album + " Full Album";
                const searchQuery = encodeURIComponent(rawQuery);
                const baseUrl = "https://music.youtube.com";
                const musicUrl = baseUrl + searchQuery;

                // Теперь Telegram разрешит открыть ссылку, так как был клик
                tg.openLink(musicUrl);
                tg.close();
            } else {
                tg.close();
            }
        };
    </script>
</body>
</html>
