<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            width: 100%;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Чистый фрейм без параметров при загрузке -->
        <iframe id="metal-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        // Стандартный браузерный код без использования Telegram API
        const params = new URLSearchParams(window.location.search);
        const vid = params.get('vid') || '';
        
        if (vid.length > 3) {
            const p = "https://";
            const y = "youtube.com";
            const e = "/embed/";
            const a = "?autoplay=1&mute=0&rel=0";
            
            // Чистая склейка через плюс
            const finalSrc = p + y + e + vid + a;
            
            document.getElementById('metal-player').src = finalSrc;
        }
    </script>
</body>
</html>
