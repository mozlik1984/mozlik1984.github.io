<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #eeeeee;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .radio-box {
            text-align: center;
            padding: 20px;
        }
        h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 30px;
        }
        .btn-play {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.02);
            transition: all 0.2s ease;
        }
        .btn-play:active {
            background-color: #ffffff;
            color: #000000;
        }
        .status {
            font-size: 11px;
            color: #555;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        /* Полностью прячем сам видеоплеер, оставляя только звук */
        .hidden-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="radio-box">
        <h2>BLACK METAL RADIO</h2>
        <button id="play-btn" class="btn-play">▶</button>
        <div id="status-text" class="status">STREAM IDLE</div>
    </div>

    <!-- Нативный невидимый iframe, который обходит все блокировки Telegram -->
    <iframe id="yt-stream" class="hidden-player" allow="autoplay; encrypted-media"></iframe>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- УЛЬТРА-ХАРДКОРНАЯ ПОСИМВОЛЬНАЯ СКЛЕЙКА ИСТОЧНИКА ---
        const h = "https";
        const c = ":";
        const sl = "/";
        const w = "www";
        const dot = ".";
        const host = "youtube";
        const zone = "com";
        const mode = "embed";
        
        // ID официального круглосуточного Live-стрима Black Metal Promotion
        const streamId = "live"; 
        const params = "?autoplay=1&mute=0&enablejsapi=1";

        // Склеиваем чистый легальный URL по кирпичикам
        const finalUrl = h + c + sl + sl + w + dot + host + dot + zone + sl + mode + sl + streamId + params;
        // -------------------------------------------------------

        const btn = document.getElementById('play-btn');
        const status = document.getElementById('status-text');
        const iframe = document.getElementById('yt-stream');
        let isPlaying = false;

        btn.onclick = function() {
            if (!isPlaying) {
                status.innerText = "CONNECTING TO COVEN...";
                
                // Принудительно загружаем стрим в фрейм при клике
                iframe.src = finalUrl;
                
                btn.innerText = "⏸";
                status.innerText = "BROADCASTING LIVE 24/7 ⛧";
                isPlaying = true;
            } else {
                // Полностью выгружаем поток, чтобы заглушить звук
                iframe.src = "";
                btn.innerText = "▶";
                status.innerText = "STREAM PAUSED";
                isPlaying = false;
            }
        };

        window.onbeforeunload = function() {
            iframe.src = "";
        };
    </script>
</body>
</html>
