<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Нативный плеер SoundCloud с автонастройкой темной темы -->
        <iframe id="sc-player" allow="autoplay" src=""></iframe>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Раскрываем на всю шторку бота

        // --- УЛЬТРА-СТРОГАЯ ПОСИМВОЛЬНАЯ СКЛЕЙКА ПОТОКА SOUNDCLOUD ---
        const h = "https";
        const c = ":";
        const sl = "/";
        const w = "w";
        const dot = ".";
        const host = "soundcloud";
        const zone = "com";
        const api = "player";
        
        // Параметры официального 5-часового блэк-метал радио-сета
        const query = "?url=";
        const targetTrack = "https%3A//://soundcloud.com";
        const opts = "&color=%230b0b0b&auto_play=true&show_teaser=false&visual=true";

        // Собираем надежную ссылку по кирпичикам через плюс
        const finalScUrl = h + c + sl + sl + w + w + w + dot + host + dot + zone + sl + api + sl + query + targetTrack + opts;
        // -------------------------------------------------------------

        document.getElementById('sc-player').src = finalScUrl;
    </script>
</body>
</html>
