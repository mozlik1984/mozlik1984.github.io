<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Metal Hub Radio</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <script>
        window.onload = function() {
            // Собираем ссылку на тему из кусочков по нашему правилу
            const protocol = "https://";
            const domain = "t.me/";
            const path = "c/3870973478/24";
            const finalUrl = protocol + domain + path;

            try {
                const tg = window.Telegram.WebApp;
                tg.ready();
                // Команда Telegram для мгновенного открытия внутренней ссылки
                tg.openTelegramLink(finalUrl);
                // Мгновенно закрываем окно WebApp, чтобы юзер его не видел
                tg.close();
            } catch (e) {
                // Если открыли просто в браузере, делаем обычный редирект
                window.location.href = finalUrl;
            }
        };
    </script>
    <style>
        /* Мрачный черный фон на долю секунды, пока идет перенаправление */
        body {
            background-color: #0b0b0b;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
</body>
</html>
