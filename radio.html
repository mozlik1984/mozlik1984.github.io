<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #eeeeee;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .radio-box {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }
        h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 40px;
        }
        /* Стилизуем нативный плеер под брутальный стиль проекта */
        audio {
            width: 100%;
            filter: invert(90%) hue-rotate(180deg); /* Делает стандартный плеер стильным и темным */
            background: #111111;
            border-radius: 30px;
        }
        .status {
            font-size: 11px;
            color: #555;
            margin-top: 30px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="radio-box">
        <h2>BLACK METAL RADIO</h2>
        
        <!-- Железобетонный нативный HTML5 плеер, который Telegram никогда не заблокирует -->
        <!-- Ссылка на поток blackmetal.live зашита напрямую -->
        <audio controls autoplay name="media">
            <source src="https://blackmetal.live" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        
        <div class="status">BROADCASTING LIVE ⛧</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Раскрываем радио на полную шторку
    </script>
</body>
</html>
